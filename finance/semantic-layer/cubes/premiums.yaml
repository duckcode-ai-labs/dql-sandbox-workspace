name: premiums
label: Premiums
description: Premium written and earned per policy per month.
domain: finance
table: premiums
sql: SELECT * FROM premiums
measures:
  - name: written_premium
    label: Premium written
    description: Total premium written.
    sql: SUM(written_premium)
    type: sum
    aggregation: sum
    agg_time_dimension: month
  - name: earned_premium
    label: Premium earned
    description: Total premium earned.
    sql: SUM(earned_premium)
    type: sum
    aggregation: sum
    agg_time_dimension: month
dimensions:
  - name: region
    label: Region
    description: Harbor Mutual sales region of the policy.
    sql: region
    type: string
  - name: product
    label: Product
    description: Auto, Home or Health.
    sql: product
    type: string
time_dimensions:
  - name: month
    label: Month
    description: The month the premium belongs to.
    sql: month
    granularities: [month]
    primary_time: true
